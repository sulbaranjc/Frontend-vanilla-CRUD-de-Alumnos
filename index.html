<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUD de Alumnos — Frontend Vanilla</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container">
    <h1>CRUD de Alumnos</h1>
    <p class="muted">Frontend vanilla (HTML + CSS + JS) consumiendo FastAPI</p>
  </header>

  <main class="container grid">
    <!-- Panel izquierdo: Formulario -->
    <section class="card">
      <h2 id="form-title">Crear alumno</h2>

      <!-- Formulario: crear/editar -->
      <form id="alumno-form" autocomplete="off">
        <input type="hidden" id="alumnoId" />

        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" placeholder="Nombre completo" required />
        </div>

        <div class="field-group">
          <div class="field">
            <label for="nota1">Nota 1</label>
            <input id="nota1" name="nota1" type="number" step="0.1" min="0" max="10" required />
          </div>
          <div class="field">
            <label for="nota2">Nota 2</label>
            <input id="nota2" name="nota2" type="number" step="0.1" min="0" max="10" required />
          </div>
          <div class="field">
            <label for="nota3">Nota 3</label>
            <input id="nota3" name="nota3" type="number" step="0.1" min="0" max="10" required />
          </div>
          <div class="field">
            <label for="notaFinal">Examen</label>
            <input id="notaFinal" name="notaFinal" type="number" step="0.1" min="0" max="10" required />
          </div>
        </div>

        <div class="buttons">
          <button type="submit" class="btn primary" id="saveBtn">Guardar</button>
          <button type="button" class="btn" id="resetBtn">Limpiar</button>
        </div>
        <p class="hint">Rango permitido: 0.0 a 10.0 — El promedio se calcula en el servidor.</p>
      </form>
    </section>

    <!-- Panel derecho: Tabla -->
    <section class="card">
      <div class="table-header">
        <h2>Alumnos</h2>
        <div class="tools">
          <input type="search" id="searchInput" placeholder="Buscar por nombre…" />
          <button class="btn" id="refreshBtn" title="Recargar">↻</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="alumnosTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>N1</th>
              <th>N2</th>
              <th>N3</th>
              <th>Examen</th>
              <th>Promedio</th>
              <th class="center">Acciones</th>
            </tr>
          </thead>
          <tbody><!-- filas dinámicas --></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Snackbar de mensajes -->
  <div id="snackbar"></div>

  <footer class="container footer">
    <small>© CRUD Alumnos — Vanilla JS • FastAPI + MySQL</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
